title: "Mainline"
description: "Manage your App Store Connect apps from your iPhone."
baseurl: ""
url: "https://mainline.agnticstudio.com"

# Build settings
theme: null
plugins:
  - jekyll-seo-tag

# Navigation
nav_links:
  - title: Onboarding
    url: /onboarding/
  - title: Manual
    url: /manual/
  - title: EULA
    url: /eula/
  - title: Privacy
    url: /privacy/

# Collections
collections:
  manual:
    output: true
    permalink: /manual/:name/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "_manual"
      type: "manual"
    values:
      layout: "manual"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
